    /* Use 'starts with' selector to catch the link with or without a trailing slash */
    nav a[href^="https://unlighthouse.dev"] {

      margin-right: 0 !important;

<script>(function(){const LOGO_URL='https://www.benchmarksystems.com/wp-content/themes/accel434/assets/images/logo.png';const SIDEBAR_SELECTORS=['.sidebar','.unlighthouse__sidebar','aside','.routes-list','#routes','.pages-list','.left','.menu','.site-nav'];function disableSidebarLinks(root){try{SIDEBAR_SELECTORS.forEach(sel=>{(root.querySelectorAll?root.querySelectorAll(sel):[]).forEach(c=>{(c.querySelectorAll?c.querySelectorAll('a'):[]).forEach(a=>{try{a.removeAttribute('href');a.style.pointerEvents='none';a.style.cursor='default';}catch(e){}})});});(root.querySelectorAll?root.querySelectorAll('a'):[]).forEach(a=>{try{const href=a.getAttribute('href')||'';const l=href.toLowerCase();if(/\.json$/.test(l)||/payload\.html$/.test(l)||/payload\.js$/.test(l)||/\.pdf$/.test(l)|| (href.startsWith('http') && !href.includes(location.hostname))){a.removeAttribute('href');a.style.pointerEvents='none';a.style.cursor='default';}}catch(e){}});}catch(e){}}const observer=new MutationObserver(()=>{disableSidebarLinks(document);});observer.observe(document.documentElement||document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['href','src']});if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>disableSidebarLinks(document));else disableSidebarLinks(document);})();</script>
