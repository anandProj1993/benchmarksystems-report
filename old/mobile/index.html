<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Benchmark Systems — Mobile Performance Snapshot</title>
  <link rel="icon" href="https://www.benchmarksystems.com/wp-content/themes/accel434/assets/images/logo.png" type="image/png">
  <style>body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:#0b0f14;color:#fff}header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#071022}header img{height:36px}main{height:calc(100vh - 64px)}iframe{width:100%;height:100%;border:0}</style>
</head>
<body>
  <header>
    <img src="https://www.benchmarksystems.com/wp-content/themes/accel434/assets/images/logo.png" alt="Benchmark Systems">
    <div>
      <h1 style="margin:0;font-size:16px">Benchmark Systems — Mobile Snapshot</h1>
      <div style="font-size:12px;color:#cbd5e1">Read-only snapshot — links disabled</div>
    </div>
  </header>
  <main>
    <iframe src="./reports/lighthouse.html" title="Mobile report"></iframe>
  </main>
  <script>
    // Disable pointer events on links in the parent; leave iframe content as-is but prevent clicks.
    document.querySelectorAll('a').forEach(a=>{ a.removeAttribute('href'); a.style.pointerEvents='none'; a.style.cursor='default'; });
    // Also attempt to replace image srcs that fail inside the iframe by setting a fallback
    const iframe = document.querySelector('iframe');
    iframe.addEventListener('load', ()=>{
      try{
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        doc.querySelectorAll('a').forEach(a=>{ a.removeAttribute('href'); a.style.pointerEvents='none'; a.style.cursor='default'; });
        doc.querySelectorAll('img').forEach(img=>{ img.onerror = ()=>{ img.src = '/old/mobile/reports/screenshot.jpeg'; }; });
      }catch(e){ /* cross-origin might prevent access; ignore */ }
    });
  </script>
</body>
</html>
