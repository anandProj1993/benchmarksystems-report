<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Benchmark Systems — Performance Snapshot</title>
  <style>html,body{height:100%;margin:0}body{display:flex;flex-direction:column;font-family:Inter,system-ui,Arial,sans-serif;background:#fff;color:#111}header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #eee}header img{height:40px}main{flex:1;display:block}iframe{width:100%;height:calc(100vh - 64px);border:0}
  /* disable pointer events on links inside iframe via overlay if desired */
  </style>
</head>
<body>
  <header>
    <img src="https://www.benchmarksystems.com/wp-content/themes/accel434/assets/images/logo.png" alt="Benchmark Systems">
    <div>
      <h1 style="margin:0;font-size:18px">Benchmark Systems — Performance Snapshot</h1>
      <div style="font-size:12px;color:#666">Static snapshot (client view only) — links disabled</div>
    </div>
  </header>
  <main>
    <iframe id="reportFrame" src="./reports/lighthouse.html" title="Performance report"></iframe>
  </main>
  <script>
    // Remove navigation from the parent page; try to disable links inside iframe by overlaying a transparent element if needed
    (function(){
      // Add an overlay to block pointer events entering the iframe (prevents navigation inside embedded report)
      const o = document.createElement('div');
      o.style.position='absolute'; o.style.left=0; o.style.top='64px'; o.style.right=0; o.style.bottom=0; o.style.zIndex=9999; o.style.background='transparent'; o.style.pointerEvents='auto';
      document.body.appendChild(o);
      // Ensure iframe is still visible but clicks won't navigate
      // Replace parent logo if loaded from other sources (already using provided logo URL)
    })();
  </script>
</body>
</html>
